# Import this blueprint only when ready to provision hosting.
# Review the provider's current pricing before creating resources.
services:
  - type: web
    name: fieldwork-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fieldwork-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: SEED_PASSWORD
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
      - key: TRUST_PROXY
        value: 1
      - key: JOBS_ENABLED
        value: 'true'
databases:
  - name: fieldwork-db
    plan: free
    databaseName: fieldwork
    user: fieldwork
    ipAllowList: []
